services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cloudlens
      POSTGRES_PASSWORD: cloudlens
      POSTGRES_DB: cloudlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cloudlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudlens -d cloudlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend/cloudlens-api
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://cloudlens:cloudlens@db:5432/cloudlens
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CLOUDLENS_CONFIG_PATH: /config/accounts.yaml
    volumes:
      - ./config/accounts.yaml:/config/accounts.yaml:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: ./frontend/cloudlens-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  cloudlens_pgdata:
