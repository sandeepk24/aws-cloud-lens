# Optional local overrides — copy next to docker-compose.yml as
# docker-compose.override.yml (Compose loads it automatically).

services:
  api:
    volumes:
      - ./backend/cloudlens-api/app:/app/app:ro
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  ui:
    build:
      context: ./frontend/cloudlens-ui
